summary: >-
  Aidentified publishes three self-serve SaaS tiers with real posted prices. NONE of them includes
  API access: the API is an Enterprise/DaaS motion arranged through a sales representative, and the
  help center answer to "How can I get an API key/token?" is, verbatim, "For all Aidentified API
  inquiries, please contact your sales representative." So the pricing that IS published prices the
  application, not the API.
billing_unit: per user per month
consumption_model: >-
  Prepaid credits, not request rate. Credits are spent on data enrichment and export; the tiers
  differ mainly in credit allowance and integration entitlements.

