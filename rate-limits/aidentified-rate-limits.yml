summary: >-
  Aidentified publishes NO request rate limits of any kind — no per-key, per-account or per-endpoint
  limit, no window, no burst, and no response headers. An honest zero, probed and recorded rather
  than assumed. The first-party client neither reads nor honours any RateLimit-*, X-RateLimit-* or
  Retry-After header, and no retry/backoff logic exists in it, which is consistent with a server
  that signals nothing.

