quotas:
  note: >-
    What Aidentified DOES meter is prepaid credits per plan, not requests per second. These are
    entitlement quotas, not rate limits, and are recorded in plans/aidentified-plans-pricing.yml.
  published:
    - plan: Starter
      credits: 125
      period: month
    - plan: Premium
      credits: 5000
      period: year
    - plan: Enterprise
      credits: volume-based
  also_capped:
    - Import records per plan (75,000 on Starter and Premium; unlimited on Enterprise)
    - Import files per plan (50 on Starter and Premium; unlimited on Enterprise)
    - Saved searches per plan (100 on Starter and Premium; unlimited on Enterprise)

agent_impact: >-
  An agent calling Aidentified has no runtime signal to pace itself with: no limit to read ahead of
  time, no header to read during a run, and no documented status code or Retry-After to back off on.
  The only budget it can reason about is a credit balance it cannot query through any public API.
