      claimed: true
      source: https://www.aidentified.com/terms-conditions
      quote: >-
        "...to protect the Personal Information from and against a Security Incident in line with the
        Aidentified's security policies, which are SOC2 compliant."
      report_available: not published publicly
    - framework: CCPA / CPRA
      claimed: true
      source: https://www.aidentified.com/terms-conditions
      detail: >-
        The Terms carry a dedicated California section addressing CCPA, CPRA and CPPA obligations,
        and the site publishes See My Data / Delete My Data consumer-rights flows plus a Virginia
        privacy-rights page.
  trust_center: https://trust.aidentified.com
  detail: security/aidentified-trust-center.yml
  note: >-
    SOC 2 is asserted in a contract document the company serves publicly, and a Vanta trust center
    exists at a first-party subdomain. The specific certifications listed inside the trust center
