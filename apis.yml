apis:
- name: Aidentified Contact Matching API
  description: >-
    Bulk contact matching and enrichment. A customer creates a dataset, uploads a UTF-8 CSV of
    contacts as a dataset-file via a multipart upload, and Aidentified matches and enriches every
    record once. Thereafter a nightly delta file carries only the contacts whose attributes changed,
    and a nightly trigger file carries the most recent Money in Motion wealth events for each matched
    contact. Authenticated with a bearer JWT exchanged for an account email and password. No public
    OpenAPI is published; the surface documented here is reconstructed from Aidentified's own
    Apache-2.0 client library.
  humanURL: https://www.aidentified.com/platform/platform-capabilities
  baseURL: https://matching-api.aidentified.com
  image: https://cdn.prod.website-files.com/684cc996f51fd9e61fd926ba/684f6ebd6781811cd93569ed_logo-aidentified-cube-grad-webclip.png
