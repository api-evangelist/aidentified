aid: aidentified
name: Aidentified
description: >-
  Aidentified is a Wealth Network Intelligence platform for financial advisors, wealth managers,
  insurance brokers, investment banks and non-profits. Founded in 2017 and headquartered in Boston,
  it maps a user's existing relationships against more than 300 million professional and consumer
  profiles and over 16 billion connections to surface the warmest introduction path to any prospect,
  and it monitors 16 wealth events — job changes, liquidity events, insider stock purchases,
  acquisitions, property transactions and IPO filings — that signal when to reach out. Its machine
  surface is a bulk contact matching and enrichment API at matching-api.aidentified.com, a marketed
  realtime enrichment API, and a live OAuth-protected Model Context Protocol server at
  mcp.aidentified.com. API access is arranged through a sales representative and no public API
  reference or OpenAPI is published.
